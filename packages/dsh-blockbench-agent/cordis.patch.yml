# 插入 Host 插件行；config 可被用户 profile 的 cordis.patch.yml 覆盖。
# 本地开发默认使用 F:\Deepseek_harness\blockbench\dist\bb-agent-app（由 scripts/assemble.mjs 生成）。
- insert:
    - id: blockbench-agent
      name: '@local/dsh-blockbench-agent'
      config:
        workspaceRoot: 'F:\Deepseek_harness\blockbench\models'
        project: 'togawa-sakiko'
        autoStart: true
        executable: 'F:\Deepseek_harness\blockbench\vendor\blockbench\node_modules\electron\dist\electron.exe'
        appPath: 'F:\Deepseek_harness\blockbench\dist\bb-agent-app'
        pluginPath: 'F:\Deepseek_harness\blockbench\dist\bb-agent-app\agent\bb-agent-bridge.js'
        connectTimeoutMs: 30000
        defaultTimeoutMs: 120000
        maxImagesPerCall: 4
        imageMaxDimension: 512
        exposeGuiTools: false
        bridgeTransport: auto
        # ---- T3 云端拆解（Nano Banana Pro / Gemini 3 Pro Image，可选；见 docs/25）----
        # 没配置 key 时自动降级 T2（本地 See-through），不会消耗额度。
        # 也可用环境变量 GEMINI_API_KEY / GOOGLE_API_KEY。
        # nanoBananaApiKey: 'AIza...'
        # nanoBananaModel: 'gemini-3-pro-image'
        # nanoBananaImageSize: '2K'
        # nanoBananaAspectRatio: '16:9'
        # nanoBananaMaxReferences: 6

